apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labs-frontend
  namespace: labs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tata-labs.com
      secretName: tata-labs-tls-prod
  rules:
    - host: tata-labs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: labs-frontend
                port:
                  number: 80