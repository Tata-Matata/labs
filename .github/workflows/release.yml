name: Release

# There are several types of Release events,
# such as creating, editing, or publishing.
on:
  release:
    types: [published]

jobs:
  validate-release-tag:
    runs-on: ubuntu-latest
    outputs:
      is_semver: ${{ steps.validate.outputs.is_semver }}
    steps:
      - name: Validate release tag
        id: validate
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_semver=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release tag must match vMAJOR.MINOR.PATCH, got: $TAG_NAME" >&2
            echo "is_semver=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  release-images:
    needs: [validate-release-tag]
    if: needs.validate-release-tag.outputs.is_semver == 'true'
    uses: ./.github/workflows/image-pipeline.yml
    # permissions granted to the called workflow
    permissions:
      # read repository contents, for ex., for git checkout
      contents: read
      # allow push to GHCR
      packages: write
      # write security-related results to GitHub
      # (Trivy report)
      security-events: write
    # Pass the secrets available to this workflow to the reusable workflow
    # not required now, but might be later
    secrets: inherit
    with:
      git_ref: ${{ github.event.release.tag_name }}
      image_version: ${{ github.event.release.tag_name }}
      publish_images: true