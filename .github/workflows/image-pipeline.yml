name: Image Pipeline

on:
  workflow_call:
    inputs:
      git_ref:
        required: true
        type: string
      image_version:
        required: true
        type: string
      publish_images:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      git_ref:
        required: true
        type: string
      image_version:
        required: true
        type: string
      publish_images:
        required: true
        type: boolean

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/labs-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/labs-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # lets the calling pipeline pick which ref to build
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Go test
        working-directory: backend
        run: go test ./...

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Angular test
        working-directory: frontend
        run: npm test -- --watch=false

  trivy-fs-scan:
    env:
      TRIVY_FILESYS_SARIF_REPORT: trivy-fs-results.sarif
    runs-on: ubuntu-latest
    # only if both jobs succeed
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      # NOTE: trivy-action version is pinned in 3 places in this reusable
      # workflow (fs scan + 2 image scans). CI and release callers both use
      # this file, so update only here when bumping.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: ${{env.TRIVY_FILESYS_SARIF_REPORT}}
          exit-code: 1
      - name: Upload Trivy fs scan results
        # run even when the scan step failed on findings; the job still ends red
        # will only be skipped if the workflow is cancelled
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{env.TRIVY_FILESYS_SARIF_REPORT}}
          category: trivy-fs
      - name: Upload Trivy filesystem report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: ${{env.TRIVY_FILESYS_SARIF_REPORT}}

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      packages: write
      security-events: write
    # one job per image; each leg builds, scans, uploads and pushes its own component
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            base_image: gcr.io/distroless/static-debian12@sha256:6d635b323e6ab633016668144d38e368e2894bd824500369151573225078ee03
            registry: https://gcr.io/v2/distroless
          - component: frontend
            base_image: nginx/nginx-unprivileged:stable-alpine3.24@sha256:44e74ca483234093081138b6d7b6f561d55557756a2deefc3a5056148defeb99
            registry: https://hub.docker.com/v2/namespaces
    env:
      COMPONENT: ${{ matrix.component }}
      LOCAL_IMAGE: labs-${{ matrix.component }}:ci
      TRIVY_SARIF: trivy-${{ matrix.component }}-results.sarif
      TRIVY_JSON: trivy-${{ matrix.component }}-results.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          # latest available stable Deno 2.x release
          deno-version: v2.x
          cache: true

      - name: Set image names and tags
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/labs-$COMPONENT" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${{ inputs.image_version }}" >> "$GITHUB_ENV"
          echo "COMMIT_TAG=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          # GitHub Actions cache backend (type=gha) persists BuildKit layer
          # cache across separate CI and release runs on ephemeral runners.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
      - name: Set up Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1
      # trivy-action supports one output format per run, so scan once to JSON
      # and convert that report to SARIF (no second scan).
      - name: Trivy scan ${{ matrix.component }} image for CVEs with fixes
        run: |
          trivy image "$LOCAL_IMAGE" \
            --severity HIGH,CRITICAL \
            --format json --output "${{ env.TRIVY_JSON }}" \
            --exit-code 0
          trivy convert --format sarif --output "${{ env.TRIVY_SARIF }}" "${{ env.TRIVY_JSON }}"
      - name: Upload Trivy ${{ matrix.component }} scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.TRIVY_SARIF }}
          category: trivy-${{ matrix.component }}-image-scan
      
      - name: Upload Trivy ${{ matrix.component }} json report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}-json-report
          path: "${{ env.TRIVY_JSON }}"

      - name: Evaluate Trivy reports
        run: |
          deno run --allow-read="${{ env.TRIVY_JSON }}",".github/workflows/trivy/trivyignore.yaml" \
          --allow-run=trivy  --allow-net \
          .github/workflows/trivy/trivy-gate.ts \
          --trivyreport "${{ env.TRIVY_JSON }}" \
          --base_image "${{  matrix.base_image }}" \
          --registry "${{  matrix.registry }}" 

      - name: Log in to GHCR
        if: ${{ inputs.publish_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push ${{ matrix.component }} image
        if: ${{ inputs.publish_images }}
        run: |
          docker tag "$LOCAL_IMAGE" "$IMAGE:$IMAGE_VERSION"
          docker tag "$LOCAL_IMAGE" "$IMAGE:$COMMIT_TAG"
          docker push "$IMAGE:$IMAGE_VERSION"
          docker push "$IMAGE:$COMMIT_TAG"
