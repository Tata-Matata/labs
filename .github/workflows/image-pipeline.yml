name: Image Pipeline

on:
  workflow_call:
    inputs:
      git_ref:
        required: true
        type: string
      image_version:
        required: true
        type: string
      publish_images:
        required: true
        type: boolean

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/labs-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/labs-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Go test
        working-directory: backend
        run: go test ./...

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Angular test
        working-directory: frontend
        run: npm test -- --watch=false

  trivy-fs-scan:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      # NOTE: trivy-action version is pinned in 3 places in this reusable
      # workflow (fs scan + 2 image scans). CI and release callers both use
      # this file, so update only here when bumping.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: 0
      - name: Upload Trivy fs scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs
      - name: Fail if vulnerabilities found
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  build-and-push:
    runs-on: ubuntu-latest
    needs: [trivy-fs-scan]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set image names and tags
        run: |
          echo "BACKEND_IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/labs-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/labs-frontend" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${{ inputs.image_version }}" >> "$GITHUB_ENV"
          echo "COMMIT_TAG=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "BACKEND_LOCAL_IMAGE=labs-backend:ci" >> "$GITHUB_ENV"
          echo "FRONTEND_LOCAL_IMAGE=labs-frontend:ci" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ${{ env.BACKEND_LOCAL_IMAGE }}
          load: true
          # GitHub Actions cache backend (type=gha) persists BuildKit layer
          # cache across separate CI and release runs on ephemeral runners.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: ${{ env.FRONTEND_LOCAL_IMAGE }}
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-backend-results.sarif
          exit-code: 0
      - name: Upload Trivy backend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend
      - name: Fail if backend image has vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-frontend-results.sarif
          exit-code: 0
      - name: Upload Trivy frontend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend
      - name: Fail if frontend image has vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Log in to GHCR
        if: ${{ inputs.publish_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push backend image
        if: ${{ inputs.publish_images }}
        run: |
          docker tag "$BACKEND_LOCAL_IMAGE" "$BACKEND_IMAGE:$IMAGE_VERSION"
          docker tag "$BACKEND_LOCAL_IMAGE" "$BACKEND_IMAGE:$COMMIT_TAG"
          docker push "$BACKEND_IMAGE:$IMAGE_VERSION"
          docker push "$BACKEND_IMAGE:$COMMIT_TAG"

      - name: Tag and push frontend image
        if: ${{ inputs.publish_images }}
        run: |
          docker tag "$FRONTEND_LOCAL_IMAGE" "$FRONTEND_IMAGE:$IMAGE_VERSION"
          docker tag "$FRONTEND_LOCAL_IMAGE" "$FRONTEND_IMAGE:$COMMIT_TAG"
          docker push "$FRONTEND_IMAGE:$IMAGE_VERSION"
          docker push "$FRONTEND_IMAGE:$COMMIT_TAG"
