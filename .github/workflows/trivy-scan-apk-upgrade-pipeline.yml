name: Run Trivy scan on temporary image generated with apk upgrade

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Docker image to run apk upgrade and then Trivy scan on'
        required: true
        type: string
      vulnerabilities:
        description: 'Comma separated list of CVEs to search for in Trivy report'
        required: true
        type: string

jobs:
  test-apk-upgraded-scan:
    env:
      CONTAINER: tmp-container-apk-upgrade
      TMP_IMAGE: tmp-image-apk-upgrade
      TRIVY_JSON_REPORT: trivy-report.json
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      name: Check out repo
    - name: Pull base image
      run: docker pull "${{ inputs.image }}"
    - name: Create container from base image
      run: docker run -d --name "$CONTAINER" "${{ inputs.image }}" sleep infinity
    - name: Exec into container and run apk upgrade
      run: docker exec -u root ${{ env.CONTAINER }}  apk upgrade
    - name: Create temporary image
      run: docker commit ${{ env.CONTAINER }}  ${{ env.TMP_IMAGE }} 
    - name: Run Trivy scan on temporary image
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ env.TMP_IMAGE }}
        severity: HIGH,CRITICAL
        format: 'json'
        exit-code: 0
        scan-type: image
        output: ${{ env.TRIVY_JSON_REPORT }}
    - name: Install Deno
      uses: denoland/setup-deno@v2
      with:
        # latest available stable Deno 2.x release
        deno-version: v2.x
        cache: true
    - name: Check certain CVEs in Trivy report
      run: deno run --allow-read=${{ env.TRIVY_JSON_REPORT }} .github/workflows/trivy/trivy-find.ts --report "${{ env.TRIVY_JSON_REPORT }}" --vulnerabilities "${{ inputs.vulnerabilities }}"
      