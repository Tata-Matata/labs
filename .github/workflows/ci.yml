name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/labs-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/labs-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Go test
        working-directory: backend
        run: go test ./...

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Angular test
        working-directory: frontend
        run: npm test -- --watch=false

  trivy-fs-scan:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # NOTE: trivy-action version is pinned in 3 places in this file
      # (fs scan + 2 image scans). Update all three together when bumping.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs-results.sarif
          exit-code: 0
      - name: Upload Trivy fs scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs
      - name: Fail if vulnerabilities found
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  build-and-push:
    runs-on: ubuntu-latest
    needs: [trivy-fs-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image names and tags
        run: |
          echo "BACKEND_IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/labs-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/labs-frontend" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "COMMIT_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BACKEND_LOCAL_IMAGE=labs-backend:ci" >> "$GITHUB_ENV"
          echo "FRONTEND_LOCAL_IMAGE=labs-frontend:ci" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ${{ env.BACKEND_LOCAL_IMAGE }}
          load: true
          # GitHub Actions cache backend (type=gha) persists BuildKit layer
          # cache (including npm cache mounts) across separate CI runs on
          # different ephemeral runners, via GitHub's cache storage service.
          # Without this, --mount=type=cache would only help within a single
          # job/runner and be lost between workflow runs.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: ${{ env.FRONTEND_LOCAL_IMAGE }}
          load: true
          # See comment above on backend build re: type=gha cache persistence.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-backend-results.sarif
          exit-code: 0
      - name: Upload Trivy backend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-results.sarif
          category: trivy-backend
      - name: Fail if backend image has vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-frontend-results.sarif
          exit-code: 0
      - name: Upload Trivy frontend scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-results.sarif
          category: trivy-frontend
      - name: Fail if frontend image has vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push backend image
        run: |
          docker tag "$BACKEND_LOCAL_IMAGE" "$BACKEND_IMAGE:$IMAGE_VERSION"
          docker tag "$BACKEND_LOCAL_IMAGE" "$BACKEND_IMAGE:$COMMIT_TAG"
          docker push "$BACKEND_IMAGE:$IMAGE_VERSION"
          docker push "$BACKEND_IMAGE:$COMMIT_TAG"

      - name: Tag and push frontend image
        run: |
          docker tag "$FRONTEND_LOCAL_IMAGE" "$FRONTEND_IMAGE:$IMAGE_VERSION"
          docker tag "$FRONTEND_LOCAL_IMAGE" "$FRONTEND_IMAGE:$COMMIT_TAG"
          docker push "$FRONTEND_IMAGE:$IMAGE_VERSION"
          docker push "$FRONTEND_IMAGE:$COMMIT_TAG"
