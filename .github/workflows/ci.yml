name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore: &docs
      - "**.md"
      - "labs-docs/**"
  pull_request:
    paths-ignore: *docs

jobs:
  # A push to a branch with an open PR is covered by the pull_request run
  gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        name: Run pipeline only if push to main or to feature branch without corresponding PR open
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          run=true
          if [ "$EVENT" = "push" ] && [ "$BRANCH" != "main" ]; then
            open=$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:$BRANCH" --jq length)
            if [ "$open" -gt 0 ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  pipeline:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/image-pipeline.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    secrets: inherit
    with:
      git_ref: ${{ github.sha }}
      image_version: ci-0.0.${{ github.run_number }}
      publish_images: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
