<div class="page">
  <header class="page-header">
    <h1>DevOps Labs</h1>
    <p>Select a task to begin</p>
  </header>

  <div class="lab-grid">
    <div
      class="lab-box"
      *ngFor="let lab of labs"
      (click)="selectLab(lab)"
    >
      <div class="lab-title">{{ lab.title }}</div>
      <div class="lab-description">{{ lab.description }}</div>
    </div>
  </div>

  <p *ngIf="loadError" style="color: red; text-align: center;">{{ loadError }}</p>

  <div class="instructions-panel" *ngIf="selectedInstructions">
    <h2>Instructions</h2>
    <p>{{ selectedInstructions }}</p>
  </div>
</div>
