<div class="page">
  <header class="page-header">
    <h1>DevOps Labs</h1>
    <p>Select a task to begin</p>
  </header>

  <div class="lab-grid">
    @for (lab of labs(); track lab.id) {
      <div class="lab-box" (click)="selectLab(lab)">
        <div class="lab-title">{{ lab.title }}</div>
        <div class="lab-description">{{ lab.description }}</div>
      </div>
    }
  </div>

  @if (loadError()) {
    <p style="color: red; text-align: center;">{{ loadError() }}</p>
  }

  @if (selectedInstructions()) {
    <div class="instructions-panel">
      <h2>Instructions</h2>
      <p>{{ selectedInstructions() }}</p>
    </div>
  }

  @if (showTerminal()) {
    <div class="terminal-panel">
      <h2>Terminal</h2>
      <app-terminal></app-terminal>
    </div>
  }
</div>
