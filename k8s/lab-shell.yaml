apiVersion: apps/v1
kind: Deployment
metadata:
  name: labs-shell
  namespace: labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-shell
  template:
    metadata:
      labels:
        app: lab-shell
    spec:
      containers:
        - name: shell
          image: debian:stable-slim
          command: ["/bin/sh", "-c", "sleep infinity"]
          stdin: true
          tty: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi