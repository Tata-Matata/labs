apiVersion: batch/v1
kind: Job
metadata:
  name: labs-db-migrate
  namespace: labs
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: migrate/migrate:v4.18.3
          args:
            - "-path"
            - "/migrations"
            - "-database"
            - "$(DB_URL)"
            - "up"
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: labs-postgres-app
                  key: uri
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: labs-db-migrations
