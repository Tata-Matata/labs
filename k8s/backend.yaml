apiVersion: apps/v1
kind: Deployment
metadata:
  name: labs-backend
  namespace: labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: labs-backend
  template:
    metadata:
      labels:
        app: labs-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/tata-matata/labs-backend:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: labs-app-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/labs
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/labs
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: labs-backend
  namespace: labs
spec:
  selector:
    app: labs-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
