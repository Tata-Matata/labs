version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: labs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labs
      POSTGRES_PASSWORD: labs
      POSTGRES_DB: labs
    ports:
      - "5432:5432"
    volumes:
      - labs_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  labs_pgdata:
